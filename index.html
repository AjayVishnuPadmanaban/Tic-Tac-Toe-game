
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-container">

        <header class="header">
            <p class="tagline">THE CLASSIC GAME</p>
            <h1>Tic <span>Tac</span> Toe</h1>
            <p class="subtitle">Three in a row. That's all it takes.</p>
        </header>

        <section class="scoreboard">
            <div class="score-card active" id="playerX">
                <span class="player-symbol">X</span>
                <span class="player-name">PLAYER X</span>
                <span class="score" id="scoreX">0</span>
            </div>

            <div class="score-card" id="playerO">
                <span class="player-symbol">O</span>
                <span class="player-name">PLAYER O</span>
                <span class="score" id="scoreO">0</span>
            </div>
        </section>

        <section class="game-area">

            <div class="game-status" id="status">
                Player X's turn
            </div>

            <div class="board" id="board">

                <button class="cell" data-index="0" aria-label="Cell 1"></button>
                <button class="cell" data-index="1" aria-label="Cell 2"></button>
                <button class="cell" data-index="2" aria-label="Cell 3"></button>

                <button class="cell" data-index="3" aria-label="Cell 4"></button>
                <button class="cell" data-index="4" aria-label="Cell 5"></button>
                <button class="cell" data-index="5" aria-label="Cell 6"></button>

                <button class="cell" data-index="6" aria-label="Cell 7"></button>
                <button class="cell" data-index="7" aria-label="Cell 8"></button>
                <button class="cell" data-index="8" aria-label="Cell 9"></button>

            </div>

            <div class="result" id="result"></div>

            <div class="buttons">
                <button class="reset-btn" id="newGame">
                    New Game
                </button>

                <button class="restart-btn" id="resetScore">
                    Reset Scores
                </button>
            </div>

        </section>

        <footer>
            <p>Made with ♥ | Tic Tac Toe</p>
        </footer>

    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
